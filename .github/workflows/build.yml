name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.


    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        global-json-file: global.json
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    - name: Restore (locked)
      run: |
        dotnet restore src/AzureDesignStudio.Server --locked-mode
        dotnet restore src/AzureDesignStudio --locked-mode
        dotnet restore src/AzureDesignStudio.Mcp --locked-mode
        dotnet restore src/AzureDesignStudio.Core.Tests --locked-mode

    # Three holes, three lines: a tracked lock the restore had to rewrite
    # (diff catches it), a lock the restore just created that was never
    # committed (porcelain sees untracked files, diff does not), and a
    # project whose lock was never added at all (locked restore exits 0 on
    # a missing file, so the tracked count must equal the csproj count).
    - name: Lock files must be committed
      run: |
        git diff --exit-code -- '*packages.lock.json'
        test -z "$(git status --porcelain -- '*packages.lock.json')"
        test "$(git ls-files '*packages.lock.json' | wc -l)" -eq "$(ls src/*/*.csproj | wc -l)"

    - name: Build
      # Explicit project set instead of the full solution: the MAUI desktop
      # project targets net10.0-windows and cannot build on ubuntu runners.
      # Server + WASM + MCP + Tests transitively cover Core, AzureResources,
      # SharedModels, SourceGeneration, Workspace and Discovery.
      run: |
        dotnet build src/AzureDesignStudio.Server -c Release
        dotnet build src/AzureDesignStudio -c Release
        dotnet build src/AzureDesignStudio.Mcp -c Release
        dotnet build src/AzureDesignStudio.Core.Tests -c Release

    - name: Test (offline)
      run: dotnet test src/AzureDesignStudio.Core.Tests -c Release --no-build --filter "Category!=LiveAzure"

    - name: Build the Docker image
      shell: pwsh
      working-directory: src
      run: |
        dotnet tool install -g nbgv
        .\DockerBuild.ps1

  codeql:

    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: '/language:csharp'
