name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.


    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # global.json is the one SDK authority; the CodeQL job below still
        # pins '10.0.x' and is recorded drift, not fixed here.
        global-json-file: global.json
        # Cache key is the lock-file set, so a cache from a different graph
        # is never reused (a stale restore would look like a fresh one).
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    - name: Restore (locked)
      # Only the four Linux-safe projects: the solution carries the
      # net10.0-windows Desktop project, which cannot restore on ubuntu.
      run: |
        dotnet restore src/AzureDesignStudio.Server --locked-mode
        dotnet restore src/AzureDesignStudio --locked-mode
        dotnet restore src/AzureDesignStudio.Mcp --locked-mode
        dotnet restore src/AzureDesignStudio.Core.Tests --locked-mode

    - name: Lock files must be committed
      # --locked-mode alone is not a gate: line 1 catches a committed lock
      # that no longer matches the graph (NU1004 normally beats us to it);
      # line 2 catches a lock the restore above created or rewrote, which
      # `git diff` misses because it ignores untracked files; line 3 catches
      # a project with no committed lock at all, where --locked-mode exits 0
      # and writes one.
      run: |
        git diff --exit-code -- '*packages.lock.json'
        test -z "$(git status --porcelain -- '*packages.lock.json')"
        test "$(git ls-files '*packages.lock.json' | wc -l)" -eq "$(ls src/*/*.csproj | wc -l)"

    - name: Build
      # Explicit project set instead of the full solution: the MAUI desktop
      # project targets net10.0-windows and cannot build on ubuntu runners.
      # Server + WASM + MCP + Tests transitively cover Core, AzureResources,
      # SharedModels, SourceGeneration, Workspace and Discovery.
      # --no-restore: the locked restore above owns the graph; an implicit restore
      # here would silently rewrite a lock that the guard has already checked.
      run: |
        dotnet build src/AzureDesignStudio.Server -c Release --no-restore
        dotnet build src/AzureDesignStudio -c Release --no-restore
        dotnet build src/AzureDesignStudio.Mcp -c Release --no-restore
        dotnet build src/AzureDesignStudio.Core.Tests -c Release --no-restore

    - name: Test (offline)
      run: dotnet test src/AzureDesignStudio.Core.Tests -c Release --no-build --filter "Category!=LiveAzure"

    - name: Build the Docker image
      shell: pwsh
      working-directory: src
      run: |
        dotnet tool install -g nbgv
        .\DockerBuild.ps1

  codeql:

    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Initialize CodeQL
      uses: github/codeql-action/init@v3
      with:
        languages: csharp

    - name: Autobuild
      uses: github/codeql-action/autobuild@v3

    - name: Perform CodeQL Analysis
      uses: github/codeql-action/analyze@v3
      with:
        category: '/language:csharp'

  desktop:

    # Non-blocking on purpose: two consecutive green runs recorded in
    # .planning/phases/02-reproducible-build-and-ci-baseline/02-DESKTOP-RUNS.md
    # are the flip condition; plan 02-07 deletes the line below and requires the check.
    name: Desktop (windows-latest)
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 30

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # avoid shallow clone so nbgv can do its work.

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        # global.json is the one SDK authority here too; a second dotnet-version
        # key would make the job ignore the pinned SDK.
        global-json-file: global.json
        # Cache key is the lock-file set, so a cache from a different graph
        # is never reused (a stale restore would look like a fresh one).
        cache: true
        cache-dependency-path: '**/packages.lock.json'

    - name: Restore workloads
      # The windows-latest image ships the .NET 9 MAUI workloads only; this project
      # targets net10.0-windows10.0.19041.0, so the workload band the TFM needs is
      # resolved from the project graph rather than from a bare workload name.
      run: dotnet workload restore src/AzureDesignStudio.Desktop/AzureDesignStudio.Desktop.csproj

    - name: Restore (locked)
      # bash, not the Windows runner's PowerShell default: the guard below uses
      # POSIX `test`/`wc` syntax and would not parse as PowerShell.
      shell: bash
      run: dotnet restore src/AzureDesignStudio.sln --locked-mode

    - name: Lock files must be committed
      # Same three assertions as the Linux job's guard: a committed lock that no
      # longer matches the graph, a lock the restore created or rewrote (invisible
      # to `git diff`), and a project with no committed lock at all.
      shell: bash
      run: |
        git diff --exit-code -- '*packages.lock.json'
        test -z "$(git status --porcelain -- '*packages.lock.json')"
        test "$(git ls-files '*packages.lock.json' | wc -l)" -eq "$(ls src/*/*.csproj | wc -l)"

    - name: Start timer
      id: t0
      shell: pwsh
      run: echo "start=$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())" >> $env:GITHUB_OUTPUT

    - name: Build Desktop
      # Release, no restore (the locked restore above owns the graph) and AOT off:
      # measured 74 s with -p:RunAOTCompilation=false against 466 s with AOT on the
      # same machine. AOT is a publish concern, re-verified in Phase 11.
      run: dotnet build src/AzureDesignStudio.Desktop/AzureDesignStudio.Desktop.csproj -c Release --no-restore -p:RunAOTCompilation=false

    - name: Format (changed files)
      # Scoped on purpose: the whole solution is 51 s cold, one changed file is ~18 s,
      # and the repo-wide normalisation already landed. Exit 2 means "would change";
      # any non-zero exit is a failure. The gate fails closed: a fetch/diff error must
      # not look like "no changed files". Skipping is only for a run with no base ref.
      shell: pwsh
      run: |
        if ([string]::IsNullOrWhiteSpace($env:GITHUB_BASE_REF)) {
          Write-Host 'Not a pull-request run (no base ref); skipping the changed-file format gate.'
          exit 0
        }
        git fetch --no-tags --depth=1 origin "$env:GITHUB_BASE_REF"
        if ($LASTEXITCODE -ne 0) {
          Write-Error "git fetch of '$env:GITHUB_BASE_REF' failed (exit $LASTEXITCODE); cannot determine the changed files."
          exit 1
        }
        $changed = @(git diff --name-only --diff-filter=ACMR "origin/$env:GITHUB_BASE_REF...HEAD" -- '*.cs')
        if ($LASTEXITCODE -ne 0) {
          Write-Error "git diff against 'origin/$env:GITHUB_BASE_REF' failed (exit $LASTEXITCODE); cannot determine the changed files."
          exit 1
        }
        if ($changed.Count -eq 0) {
          Write-Host 'No changed C# files; skipping the format gate.'
          exit 0
        }
        Write-Host "Checking $($changed.Count) changed C# file(s)."
        dotnet format src/AzureDesignStudio.sln --verify-no-changes --no-restore --include $changed
        if ($LASTEXITCODE -ne 0) {
          Write-Host "dotnet format exited $LASTEXITCODE; the changed files need formatting."
          exit $LASTEXITCODE
        }

    - name: Record duration
      if: always()
      shell: pwsh
      run: |
        # Unix seconds on both ends: [DateTime]::Parse('...Z') returns Local and mixes
        # zones with UtcNow, which recorded a negative duration on UTC+2 hosts.
        $raw = '${{ steps.t0.outputs.start }}'
        if ($raw -notmatch '^\d+$') {
          Write-Warning "Start timer output '$raw' is not a unix timestamp; skipping the duration record."
          exit 0
        }
        $startUnix = [long]$raw
        $endUnix = [DateTimeOffset]::UtcNow.ToUnixTimeSeconds()
        $seconds = [Math]::Max(0, $endUnix - $startUnix)
        $metrics = [pscustomobject]@{
          job        = '${{ github.job }}'
          run_id     = '${{ github.run_id }}'
          commit     = '${{ github.sha }}'
          started_at = [DateTimeOffset]::FromUnixTimeSeconds($startUnix).UtcDateTime.ToString('o')
          ended_at   = [DateTimeOffset]::FromUnixTimeSeconds($endUnix).UtcDateTime.ToString('o')
          seconds    = [long]$seconds
          aot        = 'disabled'
        }
        $metrics | ConvertTo-Json | Set-Content desktop-build-metrics.json
        $metrics | ConvertTo-Json | Out-File -Append $env:GITHUB_STEP_SUMMARY

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: desktop-build-metrics
        path: desktop-build-metrics.json
