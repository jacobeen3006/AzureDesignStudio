syntax = "proto3";

option csharp_namespace = "AzureDesignStudio.SharedModels.Protos";

import "google/protobuf/empty.proto";

service Deploy {
	rpc SaveSubscriptionInfo(SubscriptionInfo) returns(SaveSubInfoResponse);
	rpc LoadSubscriptionInfo(google.protobuf.Empty) returns(LoadSubInfoResponse);
	rpc GetResourceGroups(GetRgsRequest) returns(GetRgsResponse);
	rpc WhatIf(DeploymentRequest) returns(WhatIfResponse);
	rpc ApprovePlan(PlanApprovalRequest) returns(PlanApprovalResponse);
	rpc CreateDeployment(DeploymentRequest) returns(stream DeploymentResponse);
	rpc GetDeploymentOperations(DeploymentOperationsRequest) returns(DeploymentOperationsResponse);
	rpc PrepareRetry(PrepareRetryRequest) returns(PrepareRetryResponse);
	rpc CreateStack(CreateStackRequest) returns(CreateStackResponse);
	// v2 plan 13.1/[36-final]: the do-not-touch list is server-side truth - enforcement
	// reads it at review and apply, so a client can never deploy around it by omitting it.
	rpc SetGuardrailPolicy(GuardrailPolicyRequest) returns(GuardrailPolicyResponse);
	rpc GetGuardrailPolicy(google.protobuf.Empty) returns(GuardrailPolicyResponse);
	// v2 plan 13.5: decommission window execution. Approval names the execution hash that
	// binds the exact lock set; the app only lands and releases window-owned locks. Purge is
	// NEVER executed here - it stays script-side behind its epoch guard.
	rpc ApproveDecomWindow(ApproveDecomWindowRequest) returns(ApproveDecomWindowResponse);
	rpc ExecuteDecomWindow(ExecuteDecomWindowRequest) returns(ExecuteDecomWindowResponse);
	rpc ReleaseDecomWindow(ReleaseDecomWindowRequest) returns(ReleaseDecomWindowResponse);
}

message SubscriptionInfo {
	string subscription_id = 1;
	string tenant_id = 2;
	string client_id = 3;
	string client_secret = 4;
	string subscription_name = 5;
}

message SaveSubInfoResponse {
	int32 status_code = 1;
}

message SubscriptionRes {
	string subscription_name = 1;
	string subscription_id = 2;
}

message LoadSubInfoResponse {
	int32 status_code = 1;
	repeated SubscriptionRes subscription_data = 2;
}

message GetRgsRequest {
	string subscription_id = 1;
}

message GetRgsResponse {
	int32 status_code = 1;
	repeated string resource_group_name = 2;
}

// Approved deployment target (v2 11.2). RESOURCE_GROUP is the legacy default: old clients
// sending no target keep deploying exactly as before. The target names the identity the plan
// hash and what-if token bind to, so an approval never rides across scopes.
enum DeployTarget {
	DEPLOY_TARGET_RESOURCE_GROUP = 0;
	DEPLOY_TARGET_SUBSCRIPTION = 1;
	DEPLOY_TARGET_MANAGEMENT_GROUP = 2;
	DEPLOY_TARGET_TENANT = 3;
}

message DeploymentRequest {
	string subscription_id = 1;
	string resource_group_name = 2;
	string arm_template = 3;
	string parameters = 4;
	string what_if_token = 5;
	string plan_hash = 6;
	// Target scope fields (v2 11.2): target defaults to RESOURCE_GROUP; management_group_id is
	// required for MANAGEMENT_GROUP; location is required for every non-resource-group target
	// (ARM needs a deployment location there).
	DeployTarget target = 7;
	string management_group_id = 8;
	string location = 9;
}

message WhatIfResponse {
	int32 status_code = 1;
	string error_message = 2;
	string what_if_token = 3;
	string status = 4;
	int32 creates = 5;
	int32 modifies = 6;
	int32 deletes = 7;
	string changes_json = 8;
	string caveats = 9;
	string plan_hash = 10;
	// Guardrails (v2 13.1): every touched resource that matches the do-not-touch list, and
	// the block verdict. A blocked review carries NO token - it cannot be approved or applied.
	repeated GuardrailFlag guardrail_flags = 11;
	bool guardrail_blocked = 12;
}

message GuardrailFlag {
	string resource_id = 1;
	string reason = 2;
}

message GuardrailPolicyRequest {
	string json = 1;
}

message GuardrailPolicyResponse {
	int32 status_code = 1;
	string error_message = 2;
	string json = 3;
	string updated_by = 4;
	string updated_at = 5;
}

message PlanApprovalRequest {
	string plan_hash = 1;
}

message PlanApprovalResponse {
	int32 status_code = 1;
	string error_message = 2;
	string plan_hash = 3;
	string approved_by = 4;
	string approved_at = 5;
}

message DeploymentResponse {
	int32 status_code = 1;
	string deployment_status = 2;
	string error_message = 3;
}

message DeploymentOperationsRequest {
	string subscription_id = 1;
	string resource_group_name = 2;
	// Target the monitor must read (v2 11.2): the same scope the deployment was created under,
	// or the operations listing comes back empty. Defaults to RESOURCE_GROUP for legacy clients.
	DeployTarget target = 3;
	string management_group_id = 4;
	string location = 5;
}

message ResourceOperationRow {
	string resource_key = 1;
	string state = 2;
	string status_code = 3;
	string timestamp_utc = 4;
}

message DeploymentOperationsResponse {
	int32 status_code = 1;
	string error_message = 2;
	string deployment_status = 3;
	repeated ResourceOperationRow operations = 4;
}

message PrepareRetryRequest {
	string template_json = 1;
	repeated string resource_keys = 2;
}

message PrepareRetryResponse {
	int32 status_code = 1;
	string error_message = 2;
	string filtered_template_json = 3;
	repeated string warnings = 4;
	repeated string matched_keys = 5;
}

// v2 plan 12.3: deploy the design as a deployment-stack. The plan identity stays
// scope+template+parameters (what-if token + plan_hash bind those); the stack name and
// unmanage policy ride beside the hash like the revert plan does, and are recorded in the
// apply audit trail. Delete-flavored policy values are refused server-side until Phase 13.
message CreateStackRequest {
	string subscription_id = 1;
	string resource_group_name = 2;
	string stack_name = 3;
	string arm_template = 4;
	string parameters = 5;
	string what_if_token = 6;
	string plan_hash = 7;
	string missing_action = 8;
	string resource_group_action = 9;
	string deployment_action = 10;
	bool deny_enabled = 11;
	repeated string deny_locks = 12;
}

message CreateStackResponse {
	int32 status_code = 1;
	string error_message = 2;
	string stack_state = 3;
	string plan_hash = 4;
}

// v2 plan 13.5: decommission window execution. A window lock is not a deployment, so the
// what-if gate cannot bind it; the execution hash binds the exact lock set instead
// (DecomExecution canonical: window + plan hash + subscription + purge date + sorted scopes).
// The app only ever LANDS and RELEASES window-owned locks - purge never executes here;
// it stays script-side behind its epoch guard. Rows echo per-scope outcomes honestly.
message DecomLockRow {
	string scope = 1;
	string outcome = 2;   // locked | already-locked | foreign-locked | failed | released | left-in-place
	string detail = 3;
}

message ApproveDecomWindowRequest {
	string subscription_id = 1;
	string window_id = 2;
	string plan_hash = 3;      // sha256: the runbook plan hash
	string execution_hash = 4; // sha256: binds the exact lock set (DecomExecution.ExecutionHash)
}

message ApproveDecomWindowResponse {
	int32 status_code = 1;
	string error_message = 2;
	string approved_by = 3;
	string approved_at = 4;
}

message ExecuteDecomWindowRequest {
	string subscription_id = 1;
	string scan_id = 2;
	string window_id = 3;
	string plan_hash = 4;
	string execution_hash = 5;
	string window_start_utc = 6;      // round-tripped "O" - notes are rebuilt server-side from these
	string window_end_utc = 7;        // "O" bytes, byte-identical to the runbook notes
	string purge_not_before_utc = 8;  // "O" - informational, part of the execution hash
	repeated string scopes = 9;       // caller sorts; server re-sorts before hash verify
}

message ExecuteDecomWindowResponse {
	int32 status_code = 1;
	string error_message = 2;
	repeated DecomLockRow rows = 3;
	string apply_id = 4; // audit correlation id
}

message ReleaseDecomWindowRequest {
	string subscription_id = 1;
	string window_id = 2;
	repeated string scopes = 3;
}

message ReleaseDecomWindowResponse {
	int32 status_code = 1;
	string error_message = 2;
	repeated DecomLockRow rows = 3;
}