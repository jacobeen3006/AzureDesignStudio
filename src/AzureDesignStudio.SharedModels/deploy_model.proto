syntax = "proto3";

option csharp_namespace = "AzureDesignStudio.SharedModels.Protos";

import "google/protobuf/empty.proto";

service Deploy {
	rpc SaveSubscriptionInfo(SubscriptionInfo) returns(SaveSubInfoResponse);
	rpc LoadSubscriptionInfo(google.protobuf.Empty) returns(LoadSubInfoResponse);
	rpc GetResourceGroups(GetRgsRequest) returns(GetRgsResponse);
	rpc WhatIf(DeploymentRequest) returns(WhatIfResponse);
	rpc ApprovePlan(PlanApprovalRequest) returns(PlanApprovalResponse);
	rpc CreateDeployment(DeploymentRequest) returns(stream DeploymentResponse);
	rpc GetDeploymentOperations(DeploymentOperationsRequest) returns(DeploymentOperationsResponse);
	rpc PrepareRetry(PrepareRetryRequest) returns(PrepareRetryResponse);
	rpc CreateStack(CreateStackRequest) returns(CreateStackResponse);
	// v2 plan 13.1/[36-final]: the do-not-touch list is server-side truth - enforcement
	// reads it at review and apply, so a client can never deploy around it by omitting it.
	rpc SetGuardrailPolicy(GuardrailPolicyRequest) returns(GuardrailPolicyResponse);
	rpc GetGuardrailPolicy(google.protobuf.Empty) returns(GuardrailPolicyResponse);
}

message SubscriptionInfo {
	string subscription_id = 1;
	string tenant_id = 2;
	string client_id = 3;
	string client_secret = 4;
	string subscription_name = 5;
}

message SaveSubInfoResponse {
	int32 status_code = 1;
}

message SubscriptionRes {
	string subscription_name = 1;
	string subscription_id = 2;
}

message LoadSubInfoResponse {
	int32 status_code = 1;
	repeated SubscriptionRes subscription_data = 2;
}

message GetRgsRequest {
	string subscription_id = 1;
}

message GetRgsResponse {
	int32 status_code = 1;
	repeated string resource_group_name = 2;
}

message DeploymentRequest {
	string subscription_id = 1;
	string resource_group_name = 2;
	string arm_template = 3;
	string parameters = 4;
	string what_if_token = 5;
	string plan_hash = 6;
}

message WhatIfResponse {
	int32 status_code = 1;
	string error_message = 2;
	string what_if_token = 3;
	string status = 4;
	int32 creates = 5;
	int32 modifies = 6;
	int32 deletes = 7;
	string changes_json = 8;
	string caveats = 9;
	string plan_hash = 10;
	// Guardrails (v2 13.1): every touched resource that matches the do-not-touch list, and
	// the block verdict. A blocked review carries NO token - it cannot be approved or applied.
	repeated GuardrailFlag guardrail_flags = 11;
	bool guardrail_blocked = 12;
}

message GuardrailFlag {
	string resource_id = 1;
	string reason = 2;
}

message GuardrailPolicyRequest {
	string json = 1;
}

message GuardrailPolicyResponse {
	int32 status_code = 1;
	string error_message = 2;
	string json = 3;
	string updated_by = 4;
	string updated_at = 5;
}

message PlanApprovalRequest {
	string plan_hash = 1;
}

message PlanApprovalResponse {
	int32 status_code = 1;
	string error_message = 2;
	string plan_hash = 3;
	string approved_by = 4;
	string approved_at = 5;
}

message DeploymentResponse {
	int32 status_code = 1;
	string deployment_status = 2;
	string error_message = 3;
}

message DeploymentOperationsRequest {
	string subscription_id = 1;
	string resource_group_name = 2;
}

message ResourceOperationRow {
	string resource_key = 1;
	string state = 2;
	string status_code = 3;
	string timestamp_utc = 4;
}

message DeploymentOperationsResponse {
	int32 status_code = 1;
	string error_message = 2;
	string deployment_status = 3;
	repeated ResourceOperationRow operations = 4;
}

message PrepareRetryRequest {
	string template_json = 1;
	repeated string resource_keys = 2;
}

message PrepareRetryResponse {
	int32 status_code = 1;
	string error_message = 2;
	string filtered_template_json = 3;
	repeated string warnings = 4;
	repeated string matched_keys = 5;
}

// v2 plan 12.3: deploy the design as a deployment-stack. The plan identity stays
// scope+template+parameters (what-if token + plan_hash bind those); the stack name and
// unmanage policy ride beside the hash like the revert plan does, and are recorded in the
// apply audit trail. Delete-flavored policy values are refused server-side until Phase 13.
message CreateStackRequest {
	string subscription_id = 1;
	string resource_group_name = 2;
	string stack_name = 3;
	string arm_template = 4;
	string parameters = 5;
	string what_if_token = 6;
	string plan_hash = 7;
	string missing_action = 8;
	string resource_group_action = 9;
	string deployment_action = 10;
	bool deny_enabled = 11;
	repeated string deny_locks = 12;
}

message CreateStackResponse {
	int32 status_code = 1;
	string error_message = 2;
	string stack_state = 3;
	string plan_hash = 4;
}