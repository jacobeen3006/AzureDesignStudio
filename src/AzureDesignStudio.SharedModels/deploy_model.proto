syntax = "proto3";

option csharp_namespace = "AzureDesignStudio.SharedModels.Protos";

import "google/protobuf/empty.proto";

service Deploy {
	rpc SaveSubscriptionInfo(SubscriptionInfo) returns(SaveSubInfoResponse);
	rpc LoadSubscriptionInfo(google.protobuf.Empty) returns(LoadSubInfoResponse);
	rpc GetResourceGroups(GetRgsRequest) returns(GetRgsResponse);
	rpc WhatIf(DeploymentRequest) returns(WhatIfResponse);
	rpc ApprovePlan(PlanApprovalRequest) returns(PlanApprovalResponse);
	rpc CreateDeployment(DeploymentRequest) returns(stream DeploymentResponse);
	rpc GetDeploymentOperations(DeploymentOperationsRequest) returns(DeploymentOperationsResponse);
}

message SubscriptionInfo {
	string subscription_id = 1;
	string tenant_id = 2;
	string client_id = 3;
	string client_secret = 4;
	string subscription_name = 5;
}

message SaveSubInfoResponse {
	int32 status_code = 1;
}

message SubscriptionRes {
	string subscription_name = 1;
	string subscription_id = 2;
}

message LoadSubInfoResponse {
	int32 status_code = 1;
	repeated SubscriptionRes subscription_data = 2;
}

message GetRgsRequest {
	string subscription_id = 1;
}

message GetRgsResponse {
	int32 status_code = 1;
	repeated string resource_group_name = 2;
}

message DeploymentRequest {
	string subscription_id = 1;
	string resource_group_name = 2;
	string arm_template = 3;
	string parameters = 4;
	string what_if_token = 5;
	string plan_hash = 6;
}

message WhatIfResponse {
	int32 status_code = 1;
	string error_message = 2;
	string what_if_token = 3;
	string status = 4;
	int32 creates = 5;
	int32 modifies = 6;
	int32 deletes = 7;
	string changes_json = 8;
	string caveats = 9;
	string plan_hash = 10;
}

message PlanApprovalRequest {
	string plan_hash = 1;
}

message PlanApprovalResponse {
	int32 status_code = 1;
	string error_message = 2;
	string plan_hash = 3;
	string approved_by = 4;
	string approved_at = 5;
}

message DeploymentResponse {
	int32 status_code = 1;
	string deployment_status = 2;
	string error_message = 3;
}

message DeploymentOperationsRequest {
	string subscription_id = 1;
	string resource_group_name = 2;
}

message ResourceOperationRow {
	string resource_key = 1;
	string state = 2;
	string status_code = 3;
	string timestamp_utc = 4;
}

message DeploymentOperationsResponse {
	int32 status_code = 1;
	string error_message = 2;
	string deployment_status = 3;
	repeated ResourceOperationRow operations = 4;
}