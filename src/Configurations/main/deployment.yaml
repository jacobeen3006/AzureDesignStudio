apiVersion: apps/v1
kind: Deployment
metadata:
  name: ads-main
  namespace: ads
  labels:
    app: ads-main
spec:
  # One replica: the what-if token gate (WhatIfTokenGate) lives in process memory, so a
  # preview issued by one pod is unknown to another and approve/apply would answer
  # WHAT_IF_STALE whenever the ingress picked a different pod. Raise this only once the
  # gate is backed by shared storage.
  replicas: 1
  selector:
    matchLabels:
      app: ads-main
  template:
    metadata:
      labels:
        app: ads-main
    spec:
      serviceAccountName: adssvcaccount
      containers:
      - name: ads-main
        image: chunliu.azurecr.io/ads-server:0.4.3-7
        imagePullPolicy: IfNotPresent
        resources:
          limits:
            memory: 2Gi
            cpu: 750m
        ports:
        - containerPort: 80
          protocol: TCP
        env:
          - name: ASPNETCORE_HTTPS_PORT
            value: "443"
